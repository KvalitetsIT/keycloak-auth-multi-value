name: Pull Request CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

jobs:
  pr_build:
    name: Build, test, and coverage comment
    runs-on: ubuntu-latest
    concurrency:
      group: pr-ci-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      # Required to add/update a PR comment with coverage results.
      pull-requests: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Cache local Maven repository
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build and test
        run: ./build/maven.sh

      - name: Generate Jacoco Badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8 # v2.12.1
        with:
          jacoco-csv-file: testreport/target/site/jacoco-aggregate/jacoco.csv

      - name: Log coverage percentage
        env:
          COVERAGE: ${{ steps.jacoco.outputs.coverage }}
        run: |
          echo "coverage = ${COVERAGE}"

      - name: Comment on PR with code coverage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COVERAGE: ${{ steps.jacoco.outputs.coverage }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `Code coverage after this PR: ${process.env.COVERAGE}`;
            const marker = '<!-- coverage-comment -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
